name: CodSpeed Benchmarks

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  # Permette a CodSpeed di generare i dati iniziali (backtest)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # per l'autenticazione OpenID Connect con CodSpeed

jobs:
  benchmarks:
    name: Esegui i benchmark
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v7

    - name: Configura Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Esegui i benchmark con CodSpeed
      uses: CodSpeedHQ/action@v5
      with:
        mode: simulation
        run: pytest benchmarks/ --codspeed
